name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and quality tooling
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic smoke test
        run: >-
          retail-lakehouse demo
          --workspace /tmp/retail-lakehouse-demo
          --seed 20260728
          --customers 15
          --products 8
          --orders 40

      - name: Upload quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-python-${{ matrix.python-version }}
          path: |
            /tmp/retail-lakehouse-demo/warehouse/_meta/quality_report.json
            /tmp/retail-lakehouse-demo/warehouse/_meta/pipeline_manifest.json
          retention-days: 7

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag retail-lakehouse:ci .

      - name: Verify command
        run: docker run --rm retail-lakehouse:ci --help

  terraform:
    name: Terraform static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize without a backend
        run: terraform -chdir=terraform init -backend=false

      - name: Validate configuration
        run: terraform -chdir=terraform validate
